name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'leaderboard.json'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build and just deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate leaderboard.json
        run: |
          if [ -f leaderboard.json ]; then
            echo "Validating leaderboard.json..."
            jq empty leaderboard.json || exit 1
            echo "leaderboard.json is valid"
          else
            echo "Warning: leaderboard.json not found (will use production API)"
          fi

      - name: Generate leaderboard.json (optional)
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Fetch latest leaderboard from API
          API_URL="https://api.vibecodeleaderboard.com/leaderboard.json"
          echo "Fetching leaderboard from $API_URL..."
          curl -fsSL "$API_URL" -o leaderboard.json || {
            echo "Warning: Failed to fetch leaderboard.json"
            echo "The site will still work using the live API"
          }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vibecodeleaderboard-frontend
          directory: .
          gitBranch: main
          wranglerVersion: '3.22.0'
